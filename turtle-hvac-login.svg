<svg
  xmlns="http://www.w3.org/2000/svg"
  width="400"
  height="800"
  viewBox="0 0 400 800"
>
  <g>
    <!-- Furnace/AC unit -->
    <rect x="120" y="250" width="160" height="300" rx="20" fill="#e0e0e0" stroke="#555" stroke-width="8" />
    <rect x="160" y="280" width="80" height="40" fill="#b0b0b0" />
    <rect x="160" y="340" width="80" height="40" fill="#90caf9" />
    <rect x="160" y="400" width="80" height="40" fill="#ffe082" />
    <!-- Turtle mascot (simplified, stylized based on your original) -->
    <g transform="translate(60,540)">
      <ellipse cx="100" cy="40" rx="80" ry="40" fill="#d3422a" stroke="#222" stroke-width="7" />
      <polygon points="80,40 140,40 110,120" fill="#d3422a" stroke="#222" stroke-width="7" />
      <rect x="110" y="0" width="60" height="30" rx="15" fill="#d3422a" stroke="#222" stroke-width="7" />
      <circle cx="160" cy="16" r="14" fill="#fff176" stroke="#222" stroke-width="7" />
      <!-- Lightning bolt -->
      <polyline points="105,25 95,60 120,70 100,110" fill="none" stroke="#ffe600" stroke-width="10" />
      <!-- Head -->
      <ellipse cx="180" cy="30" rx="30" ry="22" fill="#d3422a" stroke="#222" stroke-width="7" />
      <!-- Eyes (goggles) -->
      <ellipse cx="195" cy="30" rx="10" ry="10" fill="#fff" stroke="#222" stroke-width="5" />
      <ellipse cx="195" cy="30" rx="6" ry="6" fill="#222" />
      <ellipse cx="170" cy="30" rx="10" ry="10" fill="#fff" stroke="#222" stroke-width="5" />
      <ellipse cx="170" cy="30" rx="6" ry="6" fill="#222" />
      <!-- Legs -->
      <ellipse cx="95" cy="70" rx="13" ry="18" fill="#d3422a" stroke="#222" stroke-width="7" />
      <ellipse cx="150" cy="110" rx="13" ry="18" fill="#d3422a" stroke="#222" stroke-width="7" />
      <ellipse cx="75" cy="100" rx="13" ry="18" fill="#d3422a" stroke="#222" stroke-width="7" />
      <ellipse cx="125" cy="130" rx="13" ry="18" fill="#d3422a" stroke="#222" stroke-width="7" />
    </g>
  </g>
</svg>